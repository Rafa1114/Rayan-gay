<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title class="titulo">Histórico</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image: url(../static/img/tela2.png);
            background-size: cover;
            text-align: center;
        }

        table{
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        th{
            background: #2c7be5;
            color: white;
        }

        .voltar{
    position: absolute;
    top: 20px;
    left: 20px;

    width: 150px;
    height: 50px;

    background-color: #00437e;
    color: white;

    border: none;
    border-radius: 50px;

    font-size: 30px;
    font-family: Arial, Helvetica, sans-serif;

    cursor: pointer;
}

.apagar{
       position: absolute;
    top: 90px;
    left: 20px;

    width: 200px;
    height: 50px;

    background-color: #00437e;
    color: white;

    border: none;
    border-radius: 50px;

    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;

    cursor: pointer;
}
    </style>

</head>

<body>

<a href="/menu">
    <button class="voltar">Voltar</button>
</a>

<a href="/apagarhistorico">
    <button class="apagar">Apagar Histórico</button>
    
</a>

<h1>Histórico de Movimentações</h1>

<table>

<tr>
    <th>Nome</th>
    <th>Tipo</th>
    <th>Quantidade</th>
    <th>Data</th>
</tr>

{% for item in historico %}

<tr>

    <td>{{ item[1] }}</td>
    <td>{{ item[2] }}</td>
    <td>{{ item[3] }}</td>
    <td>{{ item[4] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
