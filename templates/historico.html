<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Histórico</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        table{
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        th{
            background: #2c7be5;
            color: white;
        }

    </style>

</head>

<body>

<a href="/menu">
    <button>Voltar</button>
</a>

<h1>Histórico de Movimentações</h1>

<table>

<tr>
    <th>Nome</th>
    <th>Tipo</th>
    <th>Quantidade</th>
    <th>Data</th>
</tr>

{% for item in historico %}

<tr>

    <td>{{ item[1] }}</td>
    <td>{{ item[2] }}</td>
    <td>{{ item[3] }}</td>
    <td>{{ item[4] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
