<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image:url(img/tela1.png);
            padding: 20px;
        }

        h1{
            text-align: center;
        }

        table{
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td{
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: #2c7be5;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }
    </style>

    <link rel="stylesheet" href="../static/style2.css">

</head>


<body>

<a href="menu">
    <button class="voltar">Voltar</button>
</a>


<div class="titulo">
    <h1>Consulta de Estoque</h1>
</div>


<br><br>


<a href="paginadonovoitem">
    <button class="adicionar">Adicionar Item</button>
</a>


<a href="/excluir_todos">
    <button>Excluir todos os itens</button>
</a>


<br><br>


<table id="tabela">

<tr>
    <th>Nome</th>
    <th>Descrição</th>
    <th>Quantidade</th>
    <th>Preço</th>
    <th>Excluir</th>
</tr>


{% for objeto in objetos %}

<tr>

    <td>{{ objeto[1] }}</td>

    <td>{{ objeto[2] }}</td>

    <td>{{ objeto[3] }}</td>

    <td>R$ {{ objeto[4] }}</td>


    <td>
        <a href="/excluir/{{ objeto[0] }}">
            <button>Excluir</button>
        </a>
    </td>

</tr>


{% endfor %}


</table>


</body>

</html>
